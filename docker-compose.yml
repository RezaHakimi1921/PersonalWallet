services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pw
      POSTGRES_PASSWORD: "46329bae68e75208ffdabd95ff4f700b"
      POSTGRES_DB: personalwallet
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pw"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgres://pw:46329bae68e75208ffdabd95ff4f700b@db:5432/personalwallet"
      NTFY_URL: "https://ntfy.sh"
      NTFY_TOPIC: "pw-590a5dd3a7f749b1"
      PUBLIC_BASE_URL: "https://78-39-51-105.nip.io"
      TZ: "Asia/Tehran"
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./pwa:/srv/pwa:ro
      - caddy_data:/data
    depends_on:
      - api

volumes:
  dbdata:
  caddy_data:
