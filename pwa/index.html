<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#020617" />
<title>کیف پول شخصی</title>
<link rel="manifest" href="/manifest.json" />
<style>
  @font-face {
    font-family: 'IRANSans';
    font-weight: 400;
    src: url('/fonts/IRANSansWeb.woff2') format('woff2');
    font-display: swap;
  }
  @font-face {
    font-family: 'IRANSans';
    font-weight: 500;
    src: url('/fonts/IRANSansWeb_Medium.woff2') format('woff2');
    font-display: swap;
  }
  @font-face {
    font-family: 'IRANSans';
    font-weight: 700;
    src: url('/fonts/IRANSansWeb_Bold.woff2') format('woff2');
    font-display: swap;
  }
  @font-face {
    font-family: 'IRANSansFaNum';
    font-weight: 400;
    src: url('/fonts/IRANSansWeb-FaNum.woff2') format('woff2');
    font-display: swap;
  }
  @font-face {
    font-family: 'IRANSansFaNum';
    font-weight: 700;
    src: url('/fonts/IRANSansWeb-FaNum-Bold.woff2') format('woff2');
    font-display: swap;
  }

  :root {
    color-scheme: dark;
    --bg: #020617;
    --surface: rgba(15, 23, 42, 0.9);
    --surface-2: #0f172a;
    --border: rgba(30, 41, 59, 0.9);
    --border-soft: rgba(30, 41, 59, 0.6);
    --text: #f1f5f9;
    --muted: #94a3b8;
    --blue: #3b82f6;
    --blue-dim: rgba(59, 130, 246, 0.15);
    --green: #34d399;
    --red: #f87171;
    --amber: #f59e0b;
    --gold: #f59e0b;
    --gold-dark: #b45309;
    --material: rgba(2, 6, 23, 0.72);
    --material-edge: rgba(148, 163, 184, 0.14);
    --scrim: rgba(0, 0, 0, 0.55);

    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
    --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
    --ease-drawer: cubic-bezier(0.32, 0.72, 0, 1);
    --dur-press: 140ms;
    --dur-modal-in: 240ms;
    --dur-modal-out: 160ms;
    --dur-sheet-in: 320ms;
    --dur-sheet-out: 220ms;
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #f8fafc;
    --surface: rgba(255, 255, 255, 0.95);
    --surface-2: #f1f5f9;
    --border: rgba(203, 213, 225, 0.9);
    --border-soft: rgba(203, 213, 225, 0.6);
    --text: #0f172a;
    --muted: #64748b;
    --blue: #2563eb;
    --blue-dim: rgba(37, 99, 235, 0.12);
    --green: #059669;
    --red: #dc2626;
    --amber: #d97706;
    --gold: #b45309;
    --gold-dark: #92400e;
    --material: rgba(248, 250, 252, 0.72);
    --material-edge: rgba(255, 255, 255, 0.7);
    --scrim: rgba(15, 23, 42, 0.35);
  }
  * { box-sizing: border-box; }
  html {
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
  }
  /* Controls respond on press (Apple: feedback on touch-down) and never select their label on long-press. */
  button, .cat-pill {
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    transition: transform var(--dur-press) var(--ease-out);
  }
  button:active:not(:disabled) { transform: scale(0.97); }
  body {
    margin: 0;
    font-family: 'IRANSans', -apple-system, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 16px;
    padding-top: calc(16px + env(safe-area-inset-top, 0px));
    padding-bottom: calc(90px + env(safe-area-inset-bottom, 0px));
  }
  .font-num { font-family: 'IRANSansFaNum', 'IRANSans', monospace; }
  h1 { font-size: 1.05rem; font-weight: 700; margin: 0 0 14px; color: var(--text); }

  nav.top-nav { display: flex; gap: 8px; overflow-x: auto; margin-bottom: 16px; }
  nav.top-nav button {
    background: var(--surface-2); color: var(--muted); border: 1px solid var(--border-soft); border-radius: 12px;
    padding: 8px 14px; font-size: 0.8rem; white-space: nowrap; cursor: pointer; font-family: inherit;
  }
  nav.top-nav button.active { background: none; color: var(--gold); border-color: transparent; border-bottom: 2px solid var(--gold); border-radius: 0; font-weight: 700; }

  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 16px; margin-bottom: 10px;
  }
  .metric-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
  .metric-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 14px;
  }
  .metric-label { font-size: 0.75rem; color: var(--muted); display: flex; justify-content: space-between; align-items: center; }
  .metric-value { font-size: 1.25rem; font-weight: 800; margin-top: 8px; }

  .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .muted { color: var(--muted); font-size: 0.8rem; }
  .amount-expense { color: var(--red); font-weight: bold; }
  .amount-income { color: var(--green); font-weight: bold; }

  select, input, button.action {
    background: var(--surface-2); color: var(--text); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px; font-size: 1rem; width: 100%; margin-top: 8px; font-family: inherit;
  }
  button.action {
    background: linear-gradient(135deg, var(--gold), var(--gold-dark)); color: #1c1203;
    border: none; cursor: pointer; margin-top: 12px; font-weight: 700;
  }
  button.action.pay { background: var(--green); color: #052e1f; }
  button.action.danger { background: rgba(248,113,113,.15); color: var(--red); border: 1px solid rgba(248,113,113,.4); }
  button.secondary { background: var(--surface-2); border: 1px solid var(--border-soft); color: var(--text) !important; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  [hidden] { display: none !important; }

  .privacy-target { user-select: text; }

  .cat-pill-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
  .cat-pill {
    border-radius: 12px; padding: 10px 12px; font-size: 0.8rem; font-weight: 600; font-family: inherit;
    text-align: right; cursor: pointer; border: 1px solid;
  }
  .cat-pill.expense { background: rgba(248,113,113,.1); border-color: rgba(248,113,113,.3); color: #fca5a5; }
  .cat-pill.income { background: rgba(52,211,153,.1); border-color: rgba(52,211,153,.3); color: #6ee7b7; }

  .bank-card {
    border-radius: 16px; padding: 18px; color: white; position: relative; overflow: hidden;
    background: linear-gradient(135deg, #1e293b, #0f172a); border: 1px solid var(--border);
    box-shadow: 0 8px 20px rgba(0,0,0,.35);
  }
  .bank-card::before {
    content: ''; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(circle at 90% -10%, rgba(255,255,255,.18), transparent 55%);
  }
  .card-chip {
    width: 36px; height: 26px; border-radius: 5px; margin-top: 14px;
    background: linear-gradient(135deg, #fde68a, #d4a72c);
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.2);
  }
  .bank-card .num { letter-spacing: 2px; font-size: 0.85rem; color: #cbd5e1; margin-top: 18px; }

  .badge { font-size: 0.7rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; }
  .badge.active { background: var(--surface-2); color: var(--muted); border: 1px solid var(--border-soft); }
  .badge.completed { background: rgba(52,211,153,.15); color: #6ee7b7; }
  .badge.gain { background: rgba(52,211,153,.15); color: #6ee7b7; }
  .badge.loss { background: rgba(248,113,113,.15); color: #fca5a5; }

  .progress-track { background: var(--surface-2); border-radius: 999px; height: 8px; margin-top: 8px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--gold-dark), var(--gold)); }

  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-top: 10px; }
  .cal-cell {
    aspect-ratio: 1; border-radius: 6px; display: flex; align-items: center; justify-content: center;
    font-size: 0.65rem; color: var(--muted); background: var(--surface-2); border: 1px solid var(--border-soft);
  }
  .weekday-bar-row { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .weekday-bar-track { flex: 1; background: var(--surface-2); border-radius: 999px; height: 14px; overflow: hidden; }
  .weekday-bar-fill { height: 100%; background: linear-gradient(90deg, var(--gold-dark), var(--gold)); }
  .bar-row { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
  .bar-track { flex: 1; background: var(--surface-2); border-radius: 999px; height: 10px; overflow: hidden; }
  .bar-fill { height: 100%; background: linear-gradient(90deg, #1d4ed8, var(--blue)); }
  .trend-up { color: var(--red); }
  .trend-down { color: var(--green); }
  .mini-bar { height: 5px; border-radius: 999px; margin-top: 10px; overflow: hidden; background: var(--surface-2); }
  .mini-bar-fill { height: 100%; }

  .accounts-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
  @media (min-width: 640px) { .accounts-grid { grid-template-columns: 1fr 1fr 1fr; } }
  .mini-bank-card {
    border-radius: 14px; padding: 14px; background: linear-gradient(135deg, #1e293b, #0f172a);
    border: 1px solid var(--border);
  }
  .mini-bank-icon {
    width: 32px; height: 32px; border-radius: 8px;
    background: linear-gradient(135deg, var(--gold), var(--gold-dark)); margin-bottom: 10px;
  }

  #btn-privacy {
    background: var(--surface-2); border: 1px solid var(--border-soft); color: var(--muted);
    border-radius: 10px; padding: 8px 12px; font-size: 0.75rem; font-family: inherit; cursor: pointer;
  }
  #btn-privacy.active { background: rgba(245,158,11,.15); border-color: rgba(245,158,11,.4); color: #fbbf24; }

  #bottom-nav {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
    background: var(--material);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    backdrop-filter: blur(20px) saturate(180%);
    border-top: 1px solid var(--material-edge);
    display: flex; align-items: center; justify-content: space-around;
    padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px));
  }
  .nav-btn {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 2px; padding: 4px 10px; border-radius: 10px; background: none; border: none;
    color: var(--muted); font-size: 10px; font-family: inherit; position: relative;
  }
  .nav-btn.active { color: var(--blue); font-weight: 700; }
  .nav-btn .icon { font-size: 18px; }
  .nav-badge {
    position: absolute; top: -2px; right: 0; background: var(--amber); color: #020617;
    border-radius: 999px; font-size: 9px; font-weight: 800; padding: 1px 5px;
  }
  #nav-fab {
    position: relative; top: -14px; width: 52px; height: 52px; border-radius: 50%;
    background: linear-gradient(135deg, #3b82f6, #6366f1); color: white; font-size: 24px;
    border: 4px solid var(--bg); box-shadow: 0 4px 14px rgba(59,130,246,.5);
    display: flex; align-items: center; justify-content: center;
  }

  /* Sheet enters and leaves along the same path (from/to the bottom); exit is faster than enter.
     display is transitioned discretely so the [hidden] exit can play before it disappears. */
  #more-sheet {
    position: fixed; inset: 0; z-index: 60; background: var(--scrim);
    display: flex; align-items: flex-end; justify-content: center;
    opacity: 1;
    transition: opacity var(--dur-sheet-in) var(--ease-out), display var(--dur-sheet-in) allow-discrete;
  }
  #more-sheet .sheet {
    width: 100%; max-width: 480px; background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 20px 20px 0 0; padding: 18px; padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px));
    transform: translateY(0);
    transition: transform var(--dur-sheet-in) var(--ease-drawer);
  }
  #more-sheet[hidden] { opacity: 0; transition-duration: var(--dur-sheet-out); }
  #more-sheet[hidden] .sheet { transform: translateY(100%); transition-duration: var(--dur-sheet-out); }
  @starting-style {
    #more-sheet { opacity: 0; }
    #more-sheet .sheet { transform: translateY(100%); }
  }
  .more-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
  .more-item {
    display: flex; align-items: center; gap: 8px; padding: 12px; border-radius: 14px;
    background: var(--surface); border: 1px solid var(--border-soft); color: var(--text);
    font-size: 0.8rem; font-weight: 600; font-family: inherit; text-align: right;
  }
  .more-item.active { background: rgba(245,158,11,.15); border-color: rgba(245,158,11,.4); color: var(--gold); }

  #fab { display: none; }
  /* Modals stay centered (not anchored to a trigger). margin:auto centers the card when it fits
     and lets a long form scroll from the top instead of being cut off on short phones. */
  #manual-modal, #sms-modal {
    position: fixed; inset: 0; background: var(--scrim); z-index: 60;
    display: flex; align-items: flex-start; justify-content: center;
    padding: calc(16px + env(safe-area-inset-top, 0px)) 16px calc(16px + env(safe-area-inset-bottom, 0px));
    overflow-y: auto; overscroll-behavior: contain;
    opacity: 1;
    transition: opacity var(--dur-modal-in) var(--ease-out), display var(--dur-modal-in) allow-discrete;
  }
  #manual-modal .card, #sms-modal .card {
    width: 100%; max-width: 360px; margin: auto;
    transform: scale(1);
    transition: transform var(--dur-modal-in) var(--ease-out);
  }
  #manual-modal[hidden], #sms-modal[hidden] { opacity: 0; transition-duration: var(--dur-modal-out); }
  #manual-modal[hidden] .card, #sms-modal[hidden] .card { transform: scale(0.96); transition-duration: var(--dur-modal-out); }
  @starting-style {
    #manual-modal, #sms-modal { opacity: 0; }
    #manual-modal .card, #sms-modal .card { transform: scale(0.96); }
  }
  textarea.sms-text {
    background: var(--surface-2); color: var(--text); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px; font-size: 1rem; width: 100%; margin-top: 8px; font-family: inherit; min-height: 90px; direction: ltr; text-align: right;
  }

  /* OTP verification step: animated digit entry that orbits into a checkmark on success. */
  .otp-card { position: relative; text-align: center; overflow: hidden; padding-top: 6px; }
  .otp-card::before {
    content: ''; position: absolute; inset: 0;
    background: radial-gradient(circle at 50% 62%, rgba(52,211,153,.22), transparent 60%);
    opacity: 0; transition: opacity .8s ease; pointer-events: none;
  }
  .otp-card.success::before { opacity: 1; }
  .otp-title { font-size: 1.05rem; font-weight: 700; margin: 4px 0 6px; transition: opacity .3s; }
  .otp-sub { font-size: .8rem; line-height: 1.6; color: var(--muted); margin: 0; transition: opacity .3s; }
  .otp-error { font-size: .75rem; color: var(--red); min-height: 1.1em; margin-top: 6px; transition: opacity .3s; }
  .otp-card.verifying .otp-title, .otp-card.verifying .otp-sub { opacity: .75; }
  .otp-stage { position: relative; height: 170px; margin-top: 10px; }
  .otp-digit {
    position: absolute; left: 50%; top: 50%;
    width: 46px; height: 46px; margin: -23px 0 0 -23px;
    border-radius: 12px;
    background: var(--surface-2);
    border: 1.5px solid var(--border);
    color: var(--text);
    text-align: center;
    outline: none;
    padding: 0;
    transition: border-color .2s, box-shadow .2s;
    will-change: transform;
  }
  .otp-digit:focus {
    border-color: var(--gold);
    box-shadow: 0 0 0 3px rgba(245,158,11,.18), 0 0 22px rgba(245,158,11,.35);
  }
  .otp-digit.fly {
    border-color: var(--border);
    border-right-color: var(--gold);
    border-bottom-color: var(--gold);
    box-shadow: 3px 3px 14px rgba(245,158,11,.25);
    pointer-events: none;
  }
  .otp-digit.error { border-color: var(--red); animation: otp-shake .4s; }
  @keyframes otp-shake { 20%, 60% { translate: -6px 0; } 40%, 80% { translate: 6px 0; } }
  .otp-ring {
    position: absolute; left: 50%; top: 50%;
    width: 100px; height: 100px; margin: -50px 0 0 -50px;
    border-radius: 50%;
    border: 2px solid var(--green);
    box-shadow: 0 0 24px rgba(52,211,153,.16), inset 0 0 24px rgba(52,211,153,.16);
    display: grid; place-items: center;
    opacity: 0; transform: scale(.4);
    transition: opacity .45s ease, transform .6s cubic-bezier(.2,1.4,.4,1);
  }
  .otp-ring.show { opacity: 1; transform: scale(1); }
  .otp-ring .otp-core {
    width: 38px; height: 38px; border-radius: 10px;
    border: 2px solid var(--green);
    background: rgba(52,211,153,.08);
    display: grid; place-items: center;
  }
  .otp-ring .otp-halo {
    position: absolute; inset: -36px; border-radius: 50%;
    border: 1px solid rgba(52,211,153,.18);
    opacity: 0; transform: scale(.8);
    transition: opacity .6s .15s, transform .8s .15s;
  }
  .otp-card.success .otp-ring .otp-halo { opacity: 1; transform: scale(1); }
  .otp-check path { stroke-dasharray: 24; stroke-dashoffset: 24; transition: stroke-dashoffset .45s .2s ease; }
  .otp-card.success .otp-check path { stroke-dashoffset: 0; }
  .otp-foot { height: 22px; margin-top: 8px; font-size: .8rem; position: relative; }
  .otp-resend-line { color: var(--muted); transition: opacity .3s; }
  .otp-resend { background: none; border: 0; padding: 0 4px; cursor: pointer; font: 600 .8rem inherit; color: var(--gold); }
  .otp-resend:disabled { color: var(--muted); cursor: default; }
  .otp-secured {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    color: var(--green); font-weight: 600;
    opacity: 0; transition: opacity .4s;
  }
  .otp-card.done .otp-resend-line { opacity: 0; pointer-events: none; }
  .otp-card.show-secured .otp-secured { opacity: 1; }
  .otp-back { margin-top: 14px; }

  /* Add-account flow: bank picker and SMS setup guide. */
  .bank-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
  .bank-tile {
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    padding: 10px 4px; border-radius: 14px; cursor: pointer;
    background: var(--surface-2); border: 1px solid var(--border-soft); color: var(--text);
    font-family: inherit; font-size: .72rem; line-height: 1.5; text-align: center;
  }
  .bank-tile img, .bank-tile-emoji {
    width: 40px; height: 40px; border-radius: 10px; background: white; padding: 4px; object-fit: contain;
    display: grid; place-items: center; font-size: 22px;
  }
  .copy-box {
    display: flex; align-items: center; gap: 8px; margin-top: 6px; padding: 8px 10px;
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px;
  }
  .copy-box code { flex: 1; min-width: 0; font-size: .75rem; overflow-wrap: anywhere; user-select: all; }
  .copy-box .copy-btn { width: auto; flex: 0 0 auto; padding: 6px 10px; border-radius: 8px; font-family: inherit; font-size: .75rem; cursor: pointer; }
  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; margin-top: 14px; padding: 4px; background: var(--surface-2); border-radius: 12px; }
  .seg button { padding: 8px; border: none; border-radius: 9px; background: none; color: var(--muted); font-family: inherit; font-size: .85rem; font-weight: 700; cursor: pointer; }
  .seg button.active { background: var(--surface); color: var(--gold); box-shadow: 0 1px 3px rgba(0,0,0,.2); }
  .steps { margin: 12px 0 0; padding-inline-start: 22px; font-size: .85rem; line-height: 1.9; }
  .steps li { margin-bottom: 4px; }
  .steps code { font-size: .8rem; background: var(--surface-2); padding: 1px 6px; border-radius: 6px; }
  .steps .copy-box { margin-bottom: 4px; }
  .sms-status { margin-top: 10px; padding: 8px 10px; border-radius: 10px; font-size: .78rem; line-height: 1.7; background: var(--blue-dim); color: var(--text); }
  .sms-status.ok { background: rgba(52,211,153,.12); color: var(--green); }

  /* Pale tints are tuned for the dark theme; on a light background they need the full-strength tokens. */
  :root[data-theme="light"] .cat-pill.expense,
  :root[data-theme="light"] .badge.loss { color: var(--red); }
  :root[data-theme="light"] .cat-pill.income,
  :root[data-theme="light"] .badge.completed,
  :root[data-theme="light"] .badge.gain { color: var(--green); }
  :root[data-theme="light"] #btn-privacy.active { color: var(--gold); }

  /* Reduced motion: keep the fades (they aid comprehension), drop the movement. */
  @media (prefers-reduced-motion: reduce) {
    button:active:not(:disabled) { transform: none; }
    #more-sheet .sheet, #more-sheet[hidden] .sheet,
    #manual-modal .card, #manual-modal[hidden] .card,
    #sms-modal .card, #sms-modal[hidden] .card { transform: none; }
    @starting-style {
      #more-sheet .sheet, #manual-modal .card, #sms-modal .card { transform: none; }
    }
  }
  @media (prefers-reduced-transparency: reduce) {
    #bottom-nav { background: var(--bg); -webkit-backdrop-filter: none; backdrop-filter: none; border-top-color: var(--border); }
  }
  @media (prefers-contrast: more) {
    #bottom-nav { background: var(--bg); -webkit-backdrop-filter: none; backdrop-filter: none; border-top: 1px solid var(--text); }
    .card, .metric-card { border-color: var(--muted); }
  }
</style>
</head>
<body>
  <div id="auth-screen" hidden style="position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px">
    <div class="card" style="width:100%;max-width:360px;margin:0">
      <canvas id="coin-canvas" width="140" height="140" style="display:block;margin:0 auto 4px;width:140px;height:140px"></canvas>
      <h1 style="text-align:center">کیف پول شخصی</h1>
      <div id="auth-form"></div>
    </div>
  </div>

  <div id="app-root">
  <div class="row" style="margin-bottom:14px;flex-wrap:wrap;gap:10px;align-items:flex-start">
    <div class="row" style="width:auto;gap:6px">
      <button id="btn-sms-sim" style="background:var(--surface-2);color:var(--muted);border:1px solid var(--border-soft);border-radius:10px;padding:8px 12px;font-size:.75rem;font-weight:700;font-family:inherit;cursor:pointer;white-space:nowrap;flex:0 0 auto">💬 تست پیامک</button>
      <button id="btn-privacy" style="width:36px;height:36px;padding:0;border-radius:50%;background:var(--surface-2);border:1px solid var(--border-soft);color:var(--muted);font-size:1.1rem;line-height:1;flex:0 0 auto">🐵</button>
      <button id="btn-theme" style="width:36px;height:36px;padding:0;border-radius:50%;background:var(--surface-2);border:1px solid var(--border-soft);color:var(--muted);font-size:1.1rem;line-height:1;flex:0 0 auto">🌙</button>
      <button id="btn-refresh" title="بروزرسانی" style="width:36px;height:36px;padding:0;border-radius:50%;background:var(--surface-2);border:1px solid var(--border-soft);color:var(--muted);font-size:1.1rem;line-height:1;flex:0 0 auto">🔄</button>
    </div>
    <div class="row" style="width:auto;gap:10px;margin-right:auto">
      <div style="text-align:left;min-width:0">
        <h1 style="margin:0;white-space:nowrap">کیف پول شخصی</h1>
      </div>
      <div style="width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--gold),var(--gold-dark));flex:0 0 auto"></div>
    </div>
  </div>

  <nav class="top-nav">
    <button data-tab="overview" class="active">داشبورد</button>
    <button data-tab="analytics">📊 تحلیل</button>
    <button data-tab="pending">در انتظار <span id="pending-badge-top" class="nav-badge" hidden style="position:static;margin-right:4px">0</span></button>
    <button data-tab="transactions">تراکنش‌ها</button>
    <button data-tab="accounts">حساب‌ها</button>
    <button data-tab="installments">اقساط</button>
    <button data-tab="investments">سرمایه‌گذاری</button>
    <button data-tab="categories">دسته‌بندی‌ها</button>
    <button data-tab="debts">بدهی و طلب</button>
    <button data-tab="reminders">⏰ یادآوری‌ها</button>
    <button data-tab="trash">🗑 سطل بازیابی</button>
  </nav>
  <div id="content"></div>

  <nav id="bottom-nav">
    <button class="nav-btn active" data-tab="overview"><span class="icon">🏠</span>داشبورد</button>
    <button class="nav-btn" data-tab="pending"><span class="icon">⏰</span>در انتظار<span id="pending-badge" class="nav-badge" hidden>0</span></button>
    <button id="nav-fab" title="ثبت سریع تراکنش">+</button>
    <button class="nav-btn" data-tab="transactions"><span class="icon">↔️</span>تراکنش‌ها</button>
    <button class="nav-btn" id="btn-more"><span class="icon">☰</span>بیشتر</button>
  </nav>

  <div id="more-sheet" hidden>
    <div class="sheet">
      <div class="row" style="margin-bottom:6px">
        <strong>سایر بخش‌های کیف‌پول</strong>
        <button class="secondary" id="btn-more-close" style="width:auto;padding:6px 12px;border-radius:10px">✕</button>
      </div>
      <div class="more-grid">
        <button class="more-item" data-tab="accounts">🏦 حساب‌های بانکی</button>
        <button class="more-item" data-tab="installments">📅 اقساط و وام‌ها</button>
        <button class="more-item" data-tab="investments">📈 سرمایه‌گذاری</button>
        <button class="more-item" data-tab="categories">🏷 دسته‌بندی‌ها</button>
        <button class="more-item" data-tab="analytics">📊 تحلیل</button>
        <button class="more-item" data-tab="debts">💰 بدهی و طلب</button>
        <button class="more-item" data-tab="reminders">⏰ یادآوری‌ها</button>
        <button class="more-item" data-tab="trash">🗑 سطل بازیابی</button>
        <button class="more-item" id="btn-account-settings">⚙️ حساب کاربری</button>
      </div>
    </div>
  </div>

  <button id="fab" title="ثبت دستی تراکنش">+</button>
  <div id="manual-modal" hidden></div>
  <div id="sms-modal" hidden></div>
  </div>

  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="/app.js"></script>
</body>
</html>
