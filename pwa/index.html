<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>کیف پول شخصی</title>
<link rel="manifest" href="/manifest.json" />
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Tahoma, Vazir, sans-serif;
    background: #0b0f14;
    color: #e8edf2;
    padding: 16px;
    padding-top: calc(16px + env(safe-area-inset-top, 0px));
    padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  }
  h1 { font-size: 1.1rem; margin: 0 0 12px; }
  nav { display: flex; gap: 8px; overflow-x: auto; margin-bottom: 16px; }
  nav button {
    background: #1a2230; color: #cfd8e3; border: none; border-radius: 10px;
    padding: 8px 14px; font-size: 0.85rem; white-space: nowrap; cursor: pointer;
  }
  nav button.active { background: #3b82f6; color: white; }
  .card {
    background: #141b26; border-radius: 12px; padding: 14px; margin-bottom: 10px;
  }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .muted { color: #8a97a8; font-size: 0.8rem; }
  .amount-expense { color: #f87171; font-weight: bold; }
  .amount-income { color: #34d399; font-weight: bold; }
  select, input, button.action {
    background: #1a2230; color: #e8edf2; border: 1px solid #2a3444; border-radius: 8px;
    padding: 8px; font-size: 0.9rem; width: 100%; margin-top: 6px;
  }
  button.action { background: #3b82f6; border: none; cursor: pointer; margin-top: 10px; }
  button.secondary { background: #2a3444; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <h1>کیف پول شخصی</h1>
  <nav>
    <button data-tab="pending" class="active">در انتظار</button>
    <button data-tab="transactions">تراکنش‌ها</button>
    <button data-tab="accounts">حساب‌ها</button>
    <button data-tab="installments">اقساط</button>
    <button data-tab="investments">سرمایه‌گذاری</button>
    <button data-tab="categories">دسته‌بندی‌ها</button>
  </nav>
  <div id="content"></div>

  <script src="/app.js"></script>
</body>
</html>
